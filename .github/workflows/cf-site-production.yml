name: Cloudflare production (microns-site)

# Phase 3 of the Cloudflare migration (docs/migration/PLAN.md §5.3, runbook §6 S11-S14). Manual dispatch only, from
# the main branch, behind the GitHub environment "production" (required reviewer: the owner; deployment branches:
# main only). Every wrangler command selects `--env production` of workers/site/wrangler.jsonc (the bundle guard
# through CLOUDFLARE_ENV), except the top-level dry run that proves the script is the same; cf-preview.yml keeps
# using the top level. Preview and production versions belong to the same Worker (microns-site).
#
# Actions (input "action"):
#   upload  the cf-preview.yml build and checks (keep both files in step), then a production version upload tagged
#           prod-<first 12 hex of the commit>. Prints the version ID and its version preview URL. Changes no traffic.
#   deploy  reads the given version back from Cloudflare and refuses it unless it carries a production tag and the
#           production API_MACHINE_HOSTS value (an upload of this workflow); then deploys it to 100 %. The deployed
#           version serves microns-site.<subdomain>.workers.dev at once, and the zone routes once they exist and the
#           records are proxied. Rollback: deploy again with the previous tagged version ID.
#   routes  creates the Workers Routes www.micronshub.eu/* and *.micronshub.eu/* of env.production (runbook S11).
#           Inert while the zone records are DNS only. Re-running replaces the route list with the same list.
#           Afterwards the owner lists the zone routes (2 to microns-site, plus the routes without a Worker of
#           scripts/phase3/payloads/zone-routes.json).
#
# Secrets (names only):
#   CLOUDFLARE_API_TOKEN    environment secret of "production": Workers Scripts Edit (account), Workers Routes Edit
#                           and Zone Read on micronshub.eu (routes are given by zone_name), Account Settings Read
#   CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_TURNSTILE_SITE_KEY
#                           the repository secrets cf-preview.yml uses; from S11 the site key is the real one
#                           (the upload refuses an empty or test site key).
# A Worker secret changes with `npx wrangler versions secret put <NAME> --env production` in workers/site, then an
# upload and a deploy of this workflow; never with `wrangler secret put` or a plain `wrangler deploy`.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "upload | deploy | routes"
        required: true
        type: choice
        options: [upload, deploy, routes]
      version_id:
        description: "Version ID to deploy (action deploy only; printed by an upload run)"
        required: false
        type: string
      confirm:
        description: "Type production to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cf-site-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  production:
    name: microns-site production (${{ inputs.action }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash = `bash --noprofile --norc -eo pipefail`, so a failing command in front of `| tee` fails the step.
        shell: bash
    steps:
      - name: Guard - main branch, confirmation and inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          ACTION: ${{ inputs.action }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Not main::This workflow runs only from the main branch (dispatched from $GITHUB_REF)."; exit 1
          fi
          [ "$CONFIRM" = "production" ] || { echo "::error::Type production in the confirm input."; exit 1; }
          if [ "$ACTION" = "deploy" ] && ! printf '%s' "$VERSION_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::action deploy needs version_id (a version UUID printed by an upload run)."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.action == 'upload'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/site/package-lock.json
            workers/shared/package-lock.json
            scripts/seo-parity/package-lock.json

      - uses: actions/setup-node@v4
        if: inputs.action != 'upload'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/site/package-lock.json

      - name: Guard - no placeholder left in the production config
        run: node workers/site/scripts/check-production.mjs config

      # ----- upload: the cf-preview.yml build and checks (keep both files in step) -----
      - name: Guard - real Turnstile site key and build secrets
        if: inputs.action == 'upload'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Set these secrets before running this workflow:$missing. Nothing was built or uploaded."
            exit 1
          fi
          node workers/site/scripts/check-production.mjs site-key

      - name: Install dependencies
        if: inputs.action == 'upload'
        run: |
          npm ci
          npm --prefix workers/site ci
          npm --prefix workers/shared ci
          npm --prefix scripts/seo-parity ci

      - name: Build site (vite build, as on Vercel)
        if: inputs.action == 'upload'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          npx vite build 2>&1 | tee "$RUNNER_TEMP/vite-build.log"
          echo "index.html files in dist: $(find dist -name index.html | wc -l)"
          if grep -q 'Prerendering skipped' "$RUNNER_TEMP/vite-build.log"; then
            echo "::error title=Prerender skipped::vite build ran without the jsdom prerender. Not uploading."
            exit 1
          fi

      - name: Check prerendered pages carry no Turnstile script or widget
        if: inputs.action == 'upload'
        run: |
          hits=$(grep -rlE --include='*.html' 'challenges\.cloudflare\.com|cf-turnstile' dist || true)
          if [ -n "$hits" ]; then
            echo "$hits" | head -n 20
            echo "::error title=Turnstile in prerendered HTML::$(echo "$hits" | wc -l) file(s) in dist contain challenges.cloudflare.com or cf-turnstile. Not uploading."
            exit 1
          fi

      - name: Check prerendered pages (same set as the Vercel build)
        if: inputs.action == 'upload'
        env:
          DIST_DIR: dist
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const root = process.cwd();
          const dist = path.resolve(root, process.env.DIST_DIR || 'dist');
          const { loadSources } = await import(pathToFileURL(path.join(root, 'scripts/seo-parity/lib/sources.mjs')).href);
          const routes = (await loadSources(root)).buildPrerenderRoutes();
          const shell = readFileSync(path.join(dist, 'index.html'));
          const missing = [];
          const shellCopies = [];
          for (const route of routes) {
            const file = path.join(dist, route, 'index.html');
            if (!existsSync(file)) missing.push(route);
            else if (readFileSync(file).equals(shell)) shellCopies.push(route);
          }
          console.log(`prerender routes: ${routes.length}, missing: ${missing.length}, identical to the shell: ${shellCopies.length}`);
          if (routes.length === 0 || missing.length > 0 || shellCopies.length > 0) {
            for (const r of missing) console.log(`  missing ${r}/index.html`);
            for (const r of shellCopies) console.log(`  shell copy ${r}/index.html`);
            console.log('::error title=Prerender incomplete::dist does not contain every prerendered page of the Vercel build. Not uploading.');
            process.exit(1);
          }
          NODE

      - name: Checks (smoke, typecheck, unit tests incl. env-production, Phase 3 tools)
        if: inputs.action == 'upload'
        run: |
          node tests/middleware/smoke.mjs
          npm --prefix workers/site run typecheck
          npm --prefix workers/site test
          node --test scripts/dns-parity/test/*.test.mjs scripts/phase3/test/*.test.mjs

      - name: Same Worker script as the preview configuration; bundle guard
        if: inputs.action == 'upload'
        working-directory: workers/site
        run: |
          # Only bindings, vars and routes may differ between the environments; the script must be byte-identical.
          npx wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/dry-top" > "$RUNNER_TEMP/dry-top.log" 2>&1
          npx wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/dry-prod" 2>&1 | tee "$RUNNER_TEMP/dry-prod.log"
          cmp "$RUNNER_TEMP/dry-top/index.js" "$RUNNER_TEMP/dry-prod/index.js"
          {
            echo "### microns-site production dry-run size"
            echo '```'
            grep -E 'Total Upload|gzip' "$RUNNER_TEMP/dry-prod.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The bundle guard builds the environment that is uploaded (check-bundle.mjs calls wrangler without --env).
          CLOUDFLARE_ENV=production npm run check-bundle -- --build

      - name: Upload production version (no traffic change)
        if: inputs.action == 'upload'
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_MESSAGE: "cf-site-production upload ${{ github.run_id }} at ${{ github.sha }}"
        run: |
          npx wrangler versions upload --env production --tag "prod-${GITHUB_SHA::12}" --message "$RUN_MESSAGE" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          {
            echo "### microns-site production version (tag prod-${GITHUB_SHA::12})"
            echo '```'
            grep -iE 'version id|preview|workers\.dev' "$RUNNER_TEMP/upload.log" || true
            echo '```'
            echo "Next: parity of the version preview URL against the baseline, then dispatch deploy with this version ID."
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- deploy -----
      - name: Install Worker dependencies
        if: inputs.action != 'upload'
        working-directory: workers/site
        run: npm ci

      - name: Guard - the version is a tagged production upload
        if: inputs.action == 'deploy'
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          npx wrangler versions view "$VERSION_ID" --env production --json > "$RUNNER_TEMP/version.json"
          node scripts/check-production.mjs version "$RUNNER_TEMP/version.json"

      - name: Deploy version to 100 %
        if: inputs.action == 'deploy'
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          RUN_MESSAGE: "cf-site-production deploy ${{ github.run_id }}"
        run: |
          npx wrangler versions deploy "$VERSION_ID@100%" --env production --yes --message "$RUN_MESSAGE"
          {
            echo "### microns-site deployments"
            echo '```'
            npx wrangler deployments list --env production | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- routes -----
      - name: Apply Workers Routes (runbook S11)
        if: inputs.action == 'routes'
        working-directory: workers/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The command validates the assets directory setting; a placeholder page is enough for it.
          mkdir -p ../../dist
          [ -f ../../dist/index.html ] || echo '<!doctype html>' > ../../dist/index.html
          npx wrangler triggers deploy --env production
          echo "Routes applied. List the zone routes now (2 to microns-site plus the routes without a Worker)." >> "$GITHUB_STEP_SUMMARY"
